name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'taqweem_ahl_albayt_project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

  

      - name: Extract Android project
        run: |
          unzip -o taqweem_ahl_albayt_project.zip -d extracted
          cd extracted/taqweem_ahl_albayt_project
          sed -i '/android:preview=/d' app/src/main/res/xml/dream_info.xml
          gradle assembleDebug
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-ahl-albayt-debug-apk
          path: extracted/taqweem_ahl_albayt_project/app/build/outputs/apk/debug/app-debug.apk
